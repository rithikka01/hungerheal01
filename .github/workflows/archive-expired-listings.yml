name: Archive Expired Listings

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  archive-expired-listings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run archiving script
        run: python automation/archive_expired_listings.py